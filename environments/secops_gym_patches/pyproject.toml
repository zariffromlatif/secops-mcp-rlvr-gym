[project]
name = "secops-gym-patches"
version = "0.2.0"
description = "Fix security and business-logic bugs in small FastAPI + Postgres services; graded by hidden tests in an isolated box."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secops_gym_patches"]
# Synced from the repo by scripts/sync_envs.py; git-ignored, so list them explicitly.
artifacts = ["secops_gym_patches/data/**", "secops_gym_patches/_vendor/**", "secops_gym_patches/image/requirements.txt"]
