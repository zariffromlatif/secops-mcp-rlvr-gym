[project]
name = "secops-gym-workflows"
version = "0.1.0"
description = "Operate mock payments, ledger, ticketing and chat tools over MCP; graded on the final database state with damage penalties."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4", "pyyaml>=6.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secops_gym_workflows"]
# Synced from the repo by scripts/sync_envs.py; git-ignored, so list them explicitly.
artifacts = ["secops_gym_workflows/data/**", "secops_gym_workflows/_vendor/**"]
