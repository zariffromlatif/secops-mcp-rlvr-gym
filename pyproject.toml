[project]
name = "secops-mcp-rlvr-gym"
version = "0.1.0"
description = "Containerized RLVR environments for backend security remediation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pytest-timeout>=2.3",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["verifier"]
