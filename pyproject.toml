[project]
name = "secops-mcp-rlvr-gym"
version = "0.1.0"
description = "Containerized RLVR environments for backend security remediation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pytest-timeout>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]  # runtime/mcp_server.py uses the 2.x MCPServer API
envs = ["secops-gym-patches", "secops-gym-workflows"]

[tool.pytest.ini_options]
testpaths = ["verifier", "tests"]

[tool.uv.sources]
secops-gym-patches = { path = "environments/secops_gym_patches", editable = true }
secops-gym-workflows = { path = "environments/secops_gym_workflows", editable = true }
