name: ci

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Verifier unit tests
        run: uv run pytest -q verifier
      - name: Gold and noop patches score as expected in the Docker sandbox (3 runs each)
        run: uv run python runtime/validate_tasks.py --sandbox docker --repeat 3
