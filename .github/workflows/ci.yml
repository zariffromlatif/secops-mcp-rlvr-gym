name: ci

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Verifier unit tests
        run: uv run pytest -q verifier
      - name: Gold and noop patches score as expected
        run: uv run python runtime/validate_tasks.py
