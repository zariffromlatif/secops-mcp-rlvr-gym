name: ci

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      db:  # used by the MCP workflow episodes; patch tasks start their own Postgres per episode
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --extra mcp
      - name: Unit tests (no database)
        run: uv run pytest -q verifier tests/test_summarize_evals.py tests/test_audit_pipeline.py tests/test_score_patch.py
      - name: Patch tasks score as expected in the Docker sandbox (3 runs each)
        run: uv run python runtime/validate_tasks.py --sandbox docker --repeat 3
      - name: MCP workflows score as expected (gold solved, noop and bad trajectories not)
        run: uv run python runtime/workflows.py validate
      - name: MCP server lists all tools
        run: uv run python -c "import asyncio, sys; sys.path.insert(0, 'runtime'); import mcp_server; print([t.name for t in asyncio.run(mcp_server.server.list_tools())])"

  verifiers:
    # Both Prime Intellect environments, through verifiers' own validator.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --extra mcp --extra envs
      - run: uv run python scripts/sync_envs.py
      - name: Tool safety, workflow scoring and toolset tests
        run: uv run pytest -q tests
      - name: Build task image
        run: sh scripts/build_task_image.sh
      - name: vf-validate secops_gym_patches (gold + noop, Docker runtime)
        run: |
          uv run vf-validate secops_gym_patches --runtime.type docker --timeout.setup 300 --timeout.total 600 -o vf-out/patches
          python -c "import json,glob,sys; s=json.load(open(glob.glob('vf-out/patches/*/summary.json')[0])); print(s['outcomes']); sys.exit(s['valid_rate'] != 1.0)"
      - name: vf-validate secops_gym_workflows (gold + noop)
        run: |
          uv run vf-validate secops_gym_workflows --runtime.type subprocess --timeout.total 300 -o vf-out/workflows
          python -c "import json,glob,sys; s=json.load(open(glob.glob('vf-out/workflows/*/summary.json')[0])); print(s['outcomes']); sys.exit(s['valid_rate'] != 1.0)"
      - name: vf-validate logs (on failure)
        if: failure()
        run: |
          for f in vf-out/*/*/logs/*.log vf-out/*/*/results.jsonl; do
            [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f" | cut -c1-2000; }
          done
