name: publish-task-image

# Publishes the per-rollout box image for secops-gym-patches to GitHub Container Registry,
# so hosted runtimes (Prime sandboxes, other machines) can pull it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: "0.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --no-project python scripts/sync_envs.py
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secops-gym-task:${{ inputs.tag }}
          docker build -t "$IMAGE" environments/secops_gym_patches/secops_gym_patches/image
          docker push "$IMAGE"
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
