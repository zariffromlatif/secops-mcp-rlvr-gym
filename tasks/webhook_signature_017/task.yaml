id: webhook_signature_017
category: signature-verification
cwe: CWE-347
difficulty: hard
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI service that receives payment webhooks, backed by PostgreSQL.
  The signature rules are documented at the top of app/main.py.

  Security review finding (critical): a POST /webhooks/payment request without a Payment-Signature
  header is accepted, so anyone can mark invoices as paid.

  Make the endpoint follow ALL of the documented rules, not just the reported case.

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  security: [hidden/test_security.py]
