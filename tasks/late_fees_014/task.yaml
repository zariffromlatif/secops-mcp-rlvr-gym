id: late_fees_014
category: business-logic
bug: fee-rules
difficulty: hard
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI invoicing service backed by PostgreSQL. The late-fee
  rules are documented at the top of app/main.py.

  Bug report from a customer: "INV-12 was mostly paid (only 300.00 is still open), but on
  2026-02-15 you charged a late fee of 32.00, calculated on the full 800.00."

  Fix the late-fee calculation so that it follows ALL of the documented rules.

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  target: [hidden/test_target.py]
