id: orders_pagination_004
category: business-logic
bug: off-by-one
difficulty: easy
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI order-listing service backed by PostgreSQL.

  Bug report: "Customers say their most recent orders never show up. With 9 orders and the
  default page size of 4, the API says there are only 2 pages and page 3 returns 404."

  Fix GET /orders so that:
  - total_pages counts a final, partially filled page (9 orders / 4 per page = 3 pages)
  - every order is reachable on some page
  - pages past the end still return 404, and existing behaviour is otherwise unchanged

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  target: [hidden/test_target.py]
