id: idempotency_keys_011
category: business-logic
bug: idempotency
difficulty: hard
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI payments service backed by PostgreSQL. The idempotency
  rules are documented at the top of app/main.py.

  Bug report from a merchant: "We retried a payment with a corrected amount using the same
  Idempotency-Key and silently got the old payment back. We expected an error."

  Make POST /payments follow ALL of the documented idempotency rules.

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  target: [hidden/test_target.py]
