id: tiered_pricing_010
category: business-logic
bug: tier-boundaries
difficulty: hard
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI pricing service backed by PostgreSQL. The pricing model is
  documented at the top of app/main.py.

  Bug report from sales: "A quote for exactly 1,000 API calls came out at 80.00 instead of 100.00,
  and our largest customers are being charged less than the pricing page says."

  Make GET /quote implement the documented pricing model, including the `lines` breakdown.

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  target: [hidden/test_target.py]
