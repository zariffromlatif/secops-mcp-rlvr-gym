id: profile_mass_assignment_016
category: mass-assignment
cwe: CWE-915
difficulty: easy
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI user-profile service backed by PostgreSQL. The API gateway
  authenticates each caller and forwards their user id in the X-User-ID header.

  Security review finding (critical): PATCH /users/me copies every field of the request body that
  matches a column into the caller's row. A user can make themselves an admin, change their credit
  balance or move to another tenant.

  Fix the endpoint so that:
  - users can change only display_name, email and timezone
  - a request that includes any other field is rejected with HTTP 422 and changes nothing, even
    when it also includes editable fields
  - existing behaviour (GET /users/me, updating editable fields, the response shape) is unchanged

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  security: [hidden/test_security.py]
