id: subscription_proration_008
category: business-logic
bug: date-math
difficulty: hard
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI subscription-billing service backed by PostgreSQL.
  The proration rules are documented at the top of app/main.py.

  Bug report from finance: "Plan changes in February come out wrong. Bolt Traders (subscription 2)
  moved from Basic to Pro on 2028-02-15 and was credited 14.50 instead of 15.00."

  Make POST /subscriptions/{id}/change-plan follow the documented rules exactly, for every
  period length. Keep validation and the response shape unchanged.

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  target: [hidden/test_target.py]
