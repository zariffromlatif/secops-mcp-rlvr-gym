id: report_auth_003
category: missing-authentication
cwe: CWE-306
difficulty: easy
editable_paths:
  - app/
prompt: |
  You are working on a small FastAPI reporting service backed by PostgreSQL.
  Callers authenticate with an X-API-Key header; app/auth.py resolves the key to a tenant.

  Security review finding (critical): GET /reports/export was added for a nightly job and
  skips authentication entirely. It trusts a `tenant_id` query parameter, so anyone can
  export any tenant's invoices without a key.

  Fix the endpoint so that:
  - it requires a valid, non-revoked API key (401 otherwise), like /reports/summary
  - the tenant always comes from the API key; a `tenant_id` query parameter must never
    select another tenant's data
  - the response shape is unchanged

  You may run the tests in tests_public/. Do not modify test files.
scoring:
  regression: [tests_public, hidden/test_regression_hidden.py]
  security: [hidden/test_security.py]
